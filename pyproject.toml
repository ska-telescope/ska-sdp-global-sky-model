[project]
include = ["MANIFEST.skao.int"]
name = "ska_sdp_global_sky_model"
version = "0.6.1"
description = "SKA SDP Global Sky Model"
authors = [{name="SKA SDP Developers"}]
readme = "README.rst"
packages = [{include = "ska_sdp_global_sky_model", from = "src" }]
requires-python = ">=3.14,<4.0"
license-files = ["LICENSE"]
dependencies = [
    "fastapi >=0.162.0",
    "sqlalchemy >=2.1.6",
    "uvicorn[standard] >=0.54.0",
    "httpx >=0.28.1",
    "ska-ser-logging >=0.4.3.post0",
    "python-multipart >=0.0.32",  # needed by fastapi for parsing
    "alembic >=1.20.1",
    "ska-sdp-config >=1.6.7",
    "ska-sdp-datamodels >=3.1.0",
    "ska-sdp-dataproduct-metadata >=1.4.0",
    "psycopg[binary,pool] >=3.3.6",
    "pyyaml >=6.0.3",
    "packaging >=26.3",
    "jinja2 >=3.1.6",
    "numpy >=2.5.4",
]

[project.urls]
Documentation = "https://developer.skao.int/projects/ska-sdp-global-sky-model/en/latest/"
Repository = "https://gitlab.com/ska-telescope/sdp/ska-sdp-global-sky-model"
Changelog = "https://gitlab.com/ska-telescope/sdp/ska-sdp-global-sky-model/-/blob/main/CHANGELOG.rst"

[project.scripts]
gsm-cleanup = "ska_sdp_global_sky_model.cli.cleanup:main"
gsm-delete = "ska_sdp_global_sky_model.cli.catalogue_delete:main"

[dependency-groups]
dev = [
    "isort >=9.0.2",
    "black >=26.10.1",
    "flake8 >=7.4.1",
    "pylint >=4.1.3",
    "pylint-junit >=0.3.5",
    "pytest >=9.1.1",
    "pytest-cov >=7.1.0",
    "pytest-asyncio >=1.4.1",
    "build >=1.6.1",
]
docs = [
    "sphinx >=9.2.0",
    "sphinx-copybutton >=0.5.2",
    "ska-ser-sphinx-theme >=0.2.1",
    "sphinx-new-tab-link >=0.8.2",
    "sphinxcontrib-programoutput >=0.20",
]

[[tool.poetry.source]]
name = "PyPI"
priority = "supplemental"

[[tool.poetry.source]]
name = "skao"
url = "https://artefact.skao.int/repository/pypi-internal/simple"
priority = "primary"

[tool.isort]
# auto generated files.
skip = ["src/ska_sdp_global_sky_model/alembic/versions"]
profile = "black"
line_length = 99

[tool.black]
# auto generated files.
target_version = ["py314"]
force-exclude = '''
src/ska_sdp_global_sky_model/alembic/versions
'''
line-length = 99

[tool.pylint.main]
# auto generated files.
ignore-paths = ["src/ska_sdp_global_sky_model/alembic/versions"]

[tool.pylint]
jobs = 0

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
