default:
  image: $SKA_K8S_TOOLS_BUILD_DEPLOY

variables:
  PYTHON_VERSION: python3.14
  POETRY_CONFIG_VIRTUALENVS_CREATE: "true"
  GIT_SUBMODULE_STRATEGY: recursive
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  OCI_IMAGE_BUILD_CONTEXT: $(PWD)

# Enable caching for python
cache:
  key: $CI_COMMIT_REF_SLUG
  paths:
    - .cache/pip

stages:
  - lint
  - build
  - test
  - scan
  - publish
  - pages

include:
  - project: "ska-telescope/templates-repository"
    file:
      - "gitlab-ci/includes/python.gitlab-ci.yml"
      - "gitlab-ci/includes/finaliser.gitlab-ci.yml"
      - "gitlab-ci/includes/oci-image.gitlab-ci.yml"
      - 'gitlab-ci/includes/release.gitlab-ci.yml'
      - 'gitlab-ci/includes/docs.gitlab-ci.yml'
      - 'gitlab-ci/includes/sonar-scan.gitlab-ci.yml'
      - 'gitlab-ci/includes/gitlab-templates.gitlab-ci.yml'

# Override container_scanning to scan both API and DB images
container_scanning:
  stage: scan
  parallel:
    matrix:
      - CS_IMAGE: "$CI_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME/$CI_PROJECT_NAME-api:$CI_COMMIT_SHORT_SHA"
      - CS_IMAGE: "$CI_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME/$CI_PROJECT_NAME-db:$CI_COMMIT_SHORT_SHA"

docs-build:
  before_script:
    - poetry config virtualenvs.in-project true
    - poetry config virtualenvs.create $POETRY_CONFIG_VIRTUALENVS_CREATE
    - poetry env use ${PYTHON_VERSION}
    - poetry sync --no-root --only docs
  script:
    - poetry run make docs-build $CI_SPHINX_BUILDERS

python-lint:
  before_script:
    - poetry config virtualenvs.in-project true
    - poetry config virtualenvs.create $POETRY_CONFIG_VIRTUALENVS_CREATE
    - poetry env use ${PYTHON_VERSION}
    - time poetry install
  script:
    - poetry run make python-lint

python-test:
  before_script:
    - poetry config virtualenvs.in-project true
    - poetry config virtualenvs.create $POETRY_CONFIG_VIRTUALENVS_CREATE
    - poetry env use ${PYTHON_VERSION}
    - time poetry install
  script:
    - poetry run make python-test


# Override docs-build-rtd to fail pipeline if documentation build fails
docs-build-rtd:
  allow_failure: false

# Override oci-image-build to build muti-architecture images
oci-image-build:
  tags:
    - ska-buildx
  variables:
    OCI_TARGET_PLATFORMS: --platform linux/amd64,linux/arm64
